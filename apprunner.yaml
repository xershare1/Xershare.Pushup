# Repository mode: App Runner uses the managed Python 3.11 platform (revised build).
# develop: keep ENV dev. production branch: set ENV to prod (see README).
# https://docs.aws.amazon.com/apprunner/latest/dg/service-source-code-python.html
version: 1.0
runtime: python311
build:
  commands:
    build:
      - echo "build phase"
run:
  runtime-version: "3.11"
  pre-run:
    - pip3 install --no-cache-dir -r requirements.txt
  # Use app entrypoint so the process binds to App Runner's PORT env (not only 8000).
  command: python3 -m app.main
  network:
    port: 8000
  env:
    - name: ENV
      value: dev
