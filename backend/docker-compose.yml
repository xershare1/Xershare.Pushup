# Postgres: localhost:5432  |  pgAdmin: http://localhost:5050
# Register server in pgAdmin: Host postgres, Port 5432, User postgres, Password postgres, DB pushup

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pushup
    ports:
      - "5432:5432"
    volumes:
      - pushup_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pushup_pgdata:
